---
- name: Valider les variables du SSO Authentik
  ansible.builtin.assert:
    that:
      - authentik_domain is defined
      - portainer_domain is defined
      - semaphore_domain is defined
      - homepage_domain is defined
      - beszel_domain is defined
      - uptime_kuma_domain is defined
      - termix_domain is defined
    fail_msg: >-
      authentik_sso requiert authentik_domain, portainer_domain et
      semaphore_domain, homepage_domain, beszel_domain, uptime_kuma_domain et
      termix_domain.

- name: Lire chaque secret OIDC
  ansible.builtin.command:
    argv:
      - awk
      - -F=
      - '$1 == ENVIRON["SSO_KEY"] { print substr($0, index($0, "=") + 1) }'
      - /opt/docker/authentik/.env
  environment:
    SSO_KEY: "{{ item }}"
  loop:
    - PORTAINER_OIDC_CLIENT_ID
    - PORTAINER_OIDC_CLIENT_SECRET
    - SEMAPHORE_OIDC_CLIENT_ID
    - SEMAPHORE_OIDC_CLIENT_SECRET
    - TERMIX_OIDC_CLIENT_ID
    - TERMIX_OIDC_CLIENT_SECRET
  register: authentik_sso_secret_values
  changed_when: false
  no_log: true

- name: Préparer les secrets OIDC pour les templates
  ansible.builtin.set_fact:
    portainer_oidc_client_id: "{{ authentik_sso_secret_values.results[0].stdout }}"
    portainer_oidc_client_secret: "{{ authentik_sso_secret_values.results[1].stdout }}"
    semaphore_oidc_client_id: "{{ authentik_sso_secret_values.results[2].stdout }}"
    semaphore_oidc_client_secret: "{{ authentik_sso_secret_values.results[3].stdout }}"
    termix_oidc_client_id: "{{ authentik_sso_secret_values.results[4].stdout }}"
    termix_oidc_client_secret: "{{ authentik_sso_secret_values.results[5].stdout }}"
  no_log: true

- name: Valider les secrets OIDC chargés
  ansible.builtin.assert:
    that:
      - portainer_oidc_client_id | length > 0
      - portainer_oidc_client_secret | length > 0
      - semaphore_oidc_client_id | length > 0
      - semaphore_oidc_client_secret | length > 0
      - termix_oidc_client_id | length > 0
      - termix_oidc_client_secret | length > 0
    fail_msg: Le fichier /opt/docker/authentik/.env ne contient pas les secrets OIDC attendus.
  no_log: true

- name: Déployer les applications OIDC dans Authentik
  ansible.builtin.template:
    src: applications.yaml.j2
    dest: /opt/docker/authentik/blueprints/applications.yaml
    owner: root
    group: root
    mode: "0600"
  register: authentik_sso_blueprint

- name: Attendre la fin des migrations de la base Authentik
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.tenants.models import Tenant;
        print(Tenant.objects.filter(ready=True).count())
  register: authentik_sso_database_ready
  until: authentik_sso_database_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: Appliquer explicitement le Blueprint SSO
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - apply_blueprint
      - /blueprints/custom/applications.yaml
  register: authentik_sso_blueprint_apply
  changed_when: authentik_sso_blueprint.changed

- name: Configurer le stage WebAuthn du formulaire d'identification
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.flows.models import Stage;
        from authentik.stages.identification.api import IdentificationStageSerializer;
        from authentik.stages.identification.models import IdentificationStage;
        stage = IdentificationStage.objects.get(
          name='default-authentication-identification'
        );
        expected = Stage.objects.get(
          name='default-authentication-mfa-validation'
        );
        reader = IdentificationStageSerializer(stage);
        field = next(
          name for name in reader.fields
          if 'webauthn' in name and 'stage' in name
        );
        changed = str(reader.data.get(field)) != str(expected.pk);
        updater = IdentificationStageSerializer(
          stage,
          data={field: str(expected.pk)},
          partial=True
        );
        updater.is_valid(raise_exception=True) if changed else None;
        updater.save() if changed else None;
        print(int(changed))
  register: authentik_sso_webauthn_update
  changed_when: authentik_sso_webauthn_update.stdout_lines | last == '1'

- name: Supprimer l'ancien Proxy Provider Termix après la migration OIDC
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.providers.proxy.models import ProxyProvider;
        providers = ProxyProvider.objects.filter(name='Termix');
        count = providers.count();
        providers.delete();
        print(count)
  register: authentik_sso_termix_proxy_cleanup
  changed_when: authentik_sso_termix_proxy_cleanup.stdout_lines | last | int > 0

- name: Compter les applications gérées dans Authentik
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.core.models import Application;
        print(Application.objects.filter(slug__in=['portainer','semaphore','homepage','beszel','uptime-kuma','termix']).count())
  register: authentik_sso_application_count
  changed_when: false

- name: Vérifier la création des applications Authentik
  ansible.builtin.assert:
    that:
      - authentik_sso_application_count.stdout_lines | last == '6'
    fail_msg: >-
      Authentik n'a pas créé les six applications attendues : Portainer,
      Semaphore, Homepage, Beszel, Uptime Kuma et Termix.

- name: Vérifier la migration de Termix vers OIDC
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.core.models import Application;
        from authentik.providers.oauth2.models import OAuth2Provider;
        from authentik.providers.proxy.models import ProxyProvider;
        app = Application.objects.get(slug='termix');
        print(int(OAuth2Provider.objects.filter(pk=app.provider_id).exists()));
        print(ProxyProvider.objects.filter(name='Termix').count())
  register: authentik_sso_termix_oidc
  changed_when: false

- name: Valider la migration de Termix vers OIDC
  ansible.builtin.assert:
    that:
      - authentik_sso_termix_oidc.stdout_lines[-2] == '1'
      - authentik_sso_termix_oidc.stdout_lines[-1] == '0'
    fail_msg: Termix n'utilise pas exclusivement le provider OIDC attendu.

- name: Vérifier le groupe SSO Authentik
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.core.models import Group;
        print(
          Group.objects.filter(
            name='homelab-users',
            is_superuser=False
          ).count()
        )
  register: authentik_sso_group_count
  changed_when: false

- name: Valider le groupe SSO Authentik
  ansible.builtin.assert:
    that:
      - authentik_sso_group_count.stdout_lines | last == '1'
    fail_msg: Le groupe homelab-users n'a pas été créé correctement.

- name: Vérifier les bindings du groupe sur les applications SSO
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.core.models import Application, Group;
        from authentik.policies.models import PolicyBinding;
        slugs = [
          'portainer',
          'semaphore',
          'homepage',
          'beszel',
          'uptime-kuma',
          'termix'
        ];
        group = Group.objects.get(name='homelab-users');
        apps = Application.objects.filter(slug__in=slugs);
        print(
          sum(
            PolicyBinding.objects.filter(
              target=app,
              group=group
            ).exists()
            for app in apps
          )
        )
  register: authentik_sso_binding_count
  changed_when: false

- name: Valider les bindings des applications SSO
  ansible.builtin.assert:
    that:
      - authentik_sso_binding_count.stdout_lines | last == '6'
    fail_msg: >-
      Toutes les applications SSO ne sont pas liées au groupe homelab-users.

- name: Vérifier la configuration WebAuthn du flux d'authentification
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.flows.models import Stage;
        from authentik.stages.identification.api import IdentificationStageSerializer;
        from authentik.stages.identification.models import IdentificationStage;
        stage = IdentificationStage.objects.get(
          name='default-authentication-identification'
        );
        expected = Stage.objects.get(
          name='default-authentication-mfa-validation'
        );
        reader = IdentificationStageSerializer(stage);
        field = next(
          name for name in reader.fields
          if 'webauthn' in name and 'stage' in name
        );
        value = reader.data.get(field);
        print(int(str(value) == str(expected.pk)))
  register: authentik_sso_webauthn_stage
  changed_when: false

- name: Valider la configuration WebAuthn
  ansible.builtin.assert:
    that:
      - >-
        authentik_sso_webauthn_stage.stdout_lines | last ==
        '1'
    fail_msg: >-
      Le stage default-authentication-identification n'utilise pas
      default-authentication-mfa-validation pour WebAuthn.

- name: Vérifier la durée de session Authentik
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.stages.user_login.models import UserLoginStage;
        stage = UserLoginStage.objects.get(
          name='default-authentication-login'
        );
        print(stage.session_duration.total_seconds())
  register: authentik_sso_session_duration
  changed_when: false

- name: Valider la durée de session Authentik
  ansible.builtin.assert:
    that:
      - authentik_sso_session_duration.stdout_lines | last | int == 2592000
    fail_msg: >-
      La durée de session Authentik n'est pas configurée à 30 jours.
