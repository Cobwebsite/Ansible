---
- name: Valider les variables du SSO Authentik
  ansible.builtin.assert:
    that:
      - authentik_domain is defined
      - portainer_domain is defined
      - semaphore_domain is defined
      - homepage_domain is defined
    fail_msg: >-
      authentik_sso requiert authentik_domain, portainer_domain et
      semaphore_domain et homepage_domain.

- name: Lire chaque secret OIDC
  ansible.builtin.command:
    argv:
      - awk
      - -F=
      - '$1 == ENVIRON["SSO_KEY"] { print substr($0, index($0, "=") + 1) }'
      - /opt/docker/authentik/.env
  environment:
    SSO_KEY: "{{ item }}"
  loop:
    - PORTAINER_OIDC_CLIENT_ID
    - PORTAINER_OIDC_CLIENT_SECRET
    - SEMAPHORE_OIDC_CLIENT_ID
    - SEMAPHORE_OIDC_CLIENT_SECRET
  register: authentik_sso_secret_values
  changed_when: false
  no_log: true

- name: Préparer les secrets OIDC pour les templates
  ansible.builtin.set_fact:
    portainer_oidc_client_id: "{{ authentik_sso_secret_values.results[0].stdout }}"
    portainer_oidc_client_secret: "{{ authentik_sso_secret_values.results[1].stdout }}"
    semaphore_oidc_client_id: "{{ authentik_sso_secret_values.results[2].stdout }}"
    semaphore_oidc_client_secret: "{{ authentik_sso_secret_values.results[3].stdout }}"
  no_log: true

- name: Valider les secrets OIDC chargés
  ansible.builtin.assert:
    that:
      - portainer_oidc_client_id | length > 0
      - portainer_oidc_client_secret | length > 0
      - semaphore_oidc_client_id | length > 0
      - semaphore_oidc_client_secret | length > 0
    fail_msg: Le fichier /opt/docker/authentik/.env ne contient pas les secrets OIDC attendus.
  no_log: true

- name: Déployer les applications OIDC dans Authentik
  ansible.builtin.template:
    src: applications.yaml.j2
    dest: /opt/docker/authentik/blueprints/applications.yaml
    owner: root
    group: root
    mode: "0600"
  register: authentik_sso_blueprint

- name: Attendre la fin des migrations de la base Authentik
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.tenants.models import Tenant;
        print(Tenant.objects.filter(ready=True).count())
  register: authentik_sso_database_ready
  until: authentik_sso_database_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: Appliquer explicitement le Blueprint SSO
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - apply_blueprint
      - /blueprints/custom/applications.yaml
  register: authentik_sso_blueprint_apply
  changed_when: authentik_sso_blueprint.changed

- name: Compter les applications gérées dans Authentik
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-worker
      - ak
      - shell
      - -c
      - >-
        from authentik.core.models import Application;
        print(Application.objects.filter(slug__in=['portainer','semaphore','homepage']).count())
  register: authentik_sso_application_count
  changed_when: false

- name: Vérifier la création des applications Authentik
  ansible.builtin.assert:
    that:
      - authentik_sso_application_count.stdout_lines | last == '3'
    fail_msg: >-
      Authentik n'a pas créé les trois applications attendues : Portainer,
      Semaphore et Homepage.
