---
- name: Installer les prérequis APT de Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - openssl
    state: present
    update_cache: true

- name: Créer le répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Installer la clé de signature Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Déterminer l'architecture Debian
  ansible.builtin.command: dpkg --print-architecture
  register: docker_architecture
  changed_when: false

- name: Configurer le dépôt Docker officiel
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Installer Docker Engine et Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Activer et démarrer Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Ajouter l'utilisateur Debian au groupe Docker
  ansible.builtin.user:
    name: "{{ docker_user | default('debian') }}"
    groups:
      - docker
    append: true

- name: Créer le répertoire racine des stacks Docker
  ansible.builtin.file:
    path: /opt/docker
    state: directory
    owner: root
    group: docker
    mode: "0755"
