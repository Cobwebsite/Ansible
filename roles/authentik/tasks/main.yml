---
- name: Créer le répertoire racine Authentik
  ansible.builtin.file:
    path: /opt/docker/authentik
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Créer les répertoires accessibles au processus Authentik
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0770"
  loop:
    - /opt/docker/authentik/data
    - /opt/docker/authentik/custom-templates
  register: authentik_storage_directories

- name: Créer le répertoire des certificats Authentik
  ansible.builtin.file:
    path: /opt/docker/authentik/certs
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Créer le répertoire des Blueprints Authentik
  ansible.builtin.file:
    path: /opt/docker/authentik/blueprints
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Vérifier si les secrets Authentik existent
  ansible.builtin.stat:
    path: /opt/docker/authentik/.env
  register: authentik_env

- name: Générer les secrets Authentik une seule fois
  ansible.builtin.shell: |
    set -o errexit -o nounset
    umask 077
    pg_pass="$(openssl rand -base64 36 | tr -d '\n')"
    secret_key="$(openssl rand -base64 60 | tr -d '\n')"
    bootstrap_password="$(openssl rand -base64 24 | tr -d '\n')"
    portainer_client_id="$(openssl rand -hex 24)"
    portainer_client_secret="$(openssl rand -hex 48)"
    semaphore_client_id="$(openssl rand -hex 24)"
    semaphore_client_secret="$(openssl rand -hex 48)"
    {
      printf 'PG_PASS=%s\n' "$pg_pass"
      printf 'AUTHENTIK_SECRET_KEY=%s\n' "$secret_key"
      printf 'AUTHENTIK_BOOTSTRAP_PASSWORD=%s\n' "$bootstrap_password"
      printf 'PORTAINER_OIDC_CLIENT_ID=%s\n' "$portainer_client_id"
      printf 'PORTAINER_OIDC_CLIENT_SECRET=%s\n' "$portainer_client_secret"
      printf 'SEMAPHORE_OIDC_CLIENT_ID=%s\n' "$semaphore_client_id"
      printf 'SEMAPHORE_OIDC_CLIENT_SECRET=%s\n' "$semaphore_client_secret"
    } > /opt/docker/authentik/.env
  args:
    executable: /bin/bash
  when: not authentik_env.stat.exists
  no_log: true

- name: Installer la stack Authentik
  ansible.builtin.copy:
    src: compose.yml
    dest: /opt/docker/authentik/compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Démarrer Authentik
  community.docker.docker_compose_v2:
    project_src: /opt/docker/authentik
    files: [compose.yml]
    state: present

- name: Redémarrer Authentik après une correction des permissions
  community.docker.docker_compose_v2:
    project_src: /opt/docker/authentik
    files: [compose.yml]
    services:
      - authentik-server
      - authentik-worker
    state: restarted
  when: authentik_storage_directories.changed

- name: Attendre que le serveur Authentik soit prêt
  community.docker.docker_container_info:
    name: authentik-server
  register: authentik_server_info
  until:
    - authentik_server_info.exists
    - authentik_server_info.container.State.Health.Status == 'healthy'
  retries: 60
  delay: 10

- name: Attendre que le worker Authentik soit prêt
  community.docker.docker_container_info:
    name: authentik-worker
  register: authentik_worker_info
  until:
    - authentik_worker_info.exists
    - authentik_worker_info.container.State.Health.Status == 'healthy'
  retries: 60
  delay: 10

- name: Ajouter la route Authentik à Caddy
  ansible.builtin.template:
    src: authentik.caddy.j2
    dest: /opt/docker/caddy/sites/authentik.caddy
    owner: root
    group: root
    mode: "0644"
  notify: Recharger Caddy

- name: Appliquer immédiatement la route Authentik
  ansible.builtin.meta: flush_handlers

- name: Lire le mot de passe bootstrap Authentik lors de sa création
  ansible.builtin.shell: sed -n 's/^AUTHENTIK_BOOTSTRAP_PASSWORD=//p' /opt/docker/authentik/.env
  args:
    executable: /bin/bash
  register: authentik_bootstrap_password
  changed_when: false
  when: not authentik_env.stat.exists
  no_log: true

- name: Afficher les identifiants Authentik générés
  ansible.builtin.debug:
    msg: "Authentik : utilisateur akadmin, mot de passe {{ authentik_bootstrap_password.stdout }}"
  when: not authentik_env.stat.exists
