---
- name: Créer les répertoires Homepage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/docker/homepage
    - /opt/docker/homepage/config
    - /opt/docker/homepage/images

- name: Installer le fond d'écran Homepage
  ansible.builtin.copy:
    src: wp.png
    dest: /opt/docker/homepage/images/wp.png
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer Homepage

- name: Installer la stack Homepage
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/docker/homepage/compose.yml
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer Homepage

- name: Installer la configuration Homepage
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/opt/docker/homepage/config/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - settings.yaml
    - services.yaml
    - docker.yaml
    - widgets.yaml
    - bookmarks.yaml
  notify: Redémarrer Homepage

- name: Démarrer Homepage
  community.docker.docker_compose_v2:
    project_src: /opt/docker/homepage
    files: [compose.yml]
    state: present

- name: Ajouter la route Homepage à Caddy
  ansible.builtin.template:
    src: homepage.caddy.j2
    dest: /opt/docker/caddy/sites/homepage.caddy
    owner: root
    group: root
    mode: "0644"
  notify: Recharger Caddy
