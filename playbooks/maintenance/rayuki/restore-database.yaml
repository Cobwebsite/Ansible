---
- name: Fully restore rayuki database
  hosts: all
  become: true

  vars:
    local_restore_file: "/tmp/{{ restore_file }}"
    sftp_hostname: "{{ ftp_host.split(':')[0] }}"
    sftp_port: "{{ ftp_host.split(':')[1] if ':' in ftp_host else '22' }}"
    sftp_known_host_name: >-
      {{ '[' ~ sftp_hostname ~ ']:' ~ sftp_port
      if sftp_port != '22' else sftp_hostname }}

  tasks:
    - name: Validate restore file
      ansible.builtin.assert:
        that:
          - confirm_restore | default(false) | bool
          - restore_file is defined
          - restore_file | length > 0
          - restore_file is match('^[A-Za-z0-9._-]+\.sql\.gz$')
          - ftp_host is defined
          - ftp_host | length > 0
          - ftp_host is match('^[A-Za-z0-9.-]+(:[0-9]{1,5})?$')
          - ftp_user is defined
          - ftp_user | length > 0
          - ftp_password is defined
          - ftp_password | length > 0
          - remote_ftp_path is defined
          - remote_ftp_path | length > 0
          - remote_ftp_path is match('^/[A-Za-z0-9._/-]*$')
        fail_msg: >-
          La restauration doit être confirmée avec confirm_restore: true et
          les variables restore_file et SFTP sont obligatoires.
          Exemple:
          mysql_dump_2026-08-08T02-00-00.sql.gz

    - name: Installer le client SFTP lftp
      ansible.builtin.apt:
        name: lftp
        state: present
        update_cache: true

    - name: Créer le répertoire SSH de root
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Vérifier si la clé du serveur SFTP est déjà connue
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -F
          - "{{ sftp_known_host_name }}"
          - -f
          - /root/.ssh/known_hosts
      register: restore_sftp_known_host
      changed_when: false
      failed_when: false

    - name: Lire la clé publique du serveur SFTP lors de la première connexion
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - -p
          - "{{ sftp_port }}"
          - "{{ sftp_hostname }}"
      register: restore_sftp_host_keys
      changed_when: false
      when: restore_sftp_known_host.rc != 0

    - name: Vérifier qu'une clé SFTP a été reçue
      ansible.builtin.assert:
        that:
          - >-
            restore_sftp_host_keys.stdout_lines |
            reject('match', '^#') | list | length > 0
        fail_msg: >-
          Impossible de récupérer la clé SSH du serveur SFTP
          {{ sftp_hostname }}:{{ sftp_port }}.
      when: restore_sftp_known_host.rc != 0

    - name: Enregistrer la clé du serveur SFTP
      ansible.builtin.known_hosts:
        path: /root/.ssh/known_hosts
        name: "{{ sftp_known_host_name }}"
        key: "{{ item }}"
        state: present
      loop: >-
        {{ restore_sftp_host_keys.stdout_lines |
        reject('match', '^#') | list }}
      when: restore_sftp_known_host.rc != 0

    - name: Restore database
      block:

        - name: Download backup from SFTP
          ansible.builtin.command:
            argv:
              - lftp
              - -u
              - "{{ ftp_user }},{{ ftp_password }}"
              - -e
              - >-
                set net:max-retries 1;
                set net:timeout 20;
                get {{ remote_ftp_path }}/{{ restore_file }}
                -o {{ local_restore_file }};
                bye
              - "sftp://{{ ftp_host }}"
          register: restore_download
          failed_when: false
          no_log: true

        - name: Vérifier le téléchargement SFTP
          ansible.builtin.assert:
            that:
              - restore_download.rc == 0
            fail_msg: >-
              Échec du téléchargement SFTP (lftp rc={{ restore_download.rc }}):
              {{ restore_download.stderr | default('aucun détail') |
              regex_replace(ftp_user | regex_escape, '[utilisateur masqué]') |
              regex_replace(ftp_password | regex_escape, '[mot de passe masqué]') }}

        - name: Check downloaded backup
          ansible.builtin.stat:
            path: "{{ local_restore_file }}"
          register: restore_stat

        - name: Fail if backup is missing or empty
          ansible.builtin.fail:
            msg: "Le backup {{ restore_file }} est absent ou vide."
          when:
            - not restore_stat.stat.exists or restore_stat.stat.size == 0

        - name: Verify gzip archive
          ansible.builtin.command:
            argv:
              - gzip
              - --test
              - "{{ local_restore_file }}"
          changed_when: false

        - name: Drop existing database
          ansible.builtin.shell: |
            docker exec \
              -e MYSQL_PWD='{{ db_password }}' \
              {{ mysql_container }} \
              mysql \
              -u{{ db_user }} \
              -e "DROP DATABASE IF EXISTS \`{{ db_name }}\`;"
          args:
            executable: /bin/bash
          no_log: true

        - name: Create empty database
          ansible.builtin.shell: |
            docker exec \
              -e MYSQL_PWD='{{ db_password }}' \
              {{ mysql_container }} \
              mysql \
              -u{{ db_user }} \
              -e "CREATE DATABASE \`{{ db_name }}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          args:
            executable: /bin/bash
          no_log: true

        - name: Restore database from backup
          ansible.builtin.shell: |
            set -o pipefail

            gzip -dc "{{ local_restore_file }}" | \
            docker exec -i \
              -e MYSQL_PWD='{{ db_password }}' \
              {{ mysql_container }} \
              mysql \
              -u{{ db_user }} \
              {{ db_name }}
          args:
            executable: /bin/bash
          no_log: true

        - name: Restore completed
          ansible.builtin.debug:
            msg: >-
              La base {{ db_name }} a été complètement remplacée
              par le backup {{ restore_file }}.

      always:

        - name: Remove temporary backup
          ansible.builtin.file:
            path: "{{ local_restore_file }}"
            state: absent
